<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ — goodbot-badbot.com</title>
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<link rel="stylesheet" href="/vendor/css/fonts.css">
<link rel="stylesheet" href="/vendor/css/blog.css">
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.setAttribute('data-theme', stored || (prefersLight ? 'light' : 'dark'));
  })();
</script>
__HEAD_EXTRA__
</head>
<body>

<header>
  <a class="logo" href="/">
    <span class="good">good</span><span class="sep">·</span><span class="bad">bad</span><span style="color:var(--muted)">bot</span>
  </a>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span class="label"></span>
    </button>
    <a class="nav-link" href="/">dashboard</a>
  </div>
</header>

__CONTENT__

<footer>
  <span>goodbot-badbot.com — personal experiment by Olivier Dobberkau · <a href="/blog">blog</a> · <a href="/facts">facts</a> · <a href="https://github.com/dkd-dobberkau/goodbot-badbot" target="_blank" rel="noopener noreferrer">source on GitHub</a></span>
</footer>

<script>
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});
</script>
</body>
</html>
