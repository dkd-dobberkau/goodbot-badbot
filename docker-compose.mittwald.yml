services:
  web:
    image: ghcr.io/dkd-dobberkau/goodbot-badbot:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
