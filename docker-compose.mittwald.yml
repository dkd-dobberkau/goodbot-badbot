services:
  web:
    image: ghcr.io/dkd-dobberkau/goodbot-badbot:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Salt for the visitor-IP digest. Must stay stable across deploys:
      # changing it starts a new pseudonym space and breaks distinct-IP counts.
      IP_HASH_SALT: ${IP_HASH_SALT}
      VISIT_RETENTION_DAYS: "${VISIT_RETENTION_DAYS:-180}"
